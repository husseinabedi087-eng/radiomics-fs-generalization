# Pilot plan (PREREG_STAGE1 section 10; part 6b). Generated by src/make_pilot_plan.py from metadata only.
# Datasets: the smallest, the (lower) median and the largest development dataset by
# n_samples x min(200, n_features), with n and p after the data-handling rules:
#   smallest HNSCC: n = 93, p = 105, score = 9765
#   median   Meningioma-SEG-CLASS: n = 88, p = 2030, score = 17600
#   largest  Hosny2018B: n = 207, p = 984, score = 41400
# All development datasets by score: HNSCC (9765), Brancato2023 (11600), Ahn2021 (12312), Wang2024 (13400), WORC-CRLM (15400), Meningioma-SEG-CLASS (17600), Ramella2018 (18200), Dai2023 (23800), ISPY1 (32200), Arita2018 (33600), WORC-Desmoid (40600), Hosny2018B (41400)
name: pilot
group: development
datasets:
  - HNSCC
  - Meningioma-SEG-CLASS
  - Hosny2018B
repeats: [0]
folds: [0, 1, 2, 3, 4]
search_seed_indices: [0]
budget: 2000
c0_searchers: [random, hill_climb, one_plus_one, ga, bpso_S, bpso_V, de_S, de_V, gwo_S, gwo_V, woa_S, woa_V]
control_searchers: [ga, bpso_S, de_S, gwo_S]
controls:
  C1: 5      # P (patience)
  C2: 1.0    # lambda
  C3: 4      # r (neighbours)
